  又是做了一个和他有关的梦
  <br/>
  但主要还是自己在他所在的城市游荡
  <br/>
  是一个有阳光的下午
  <br/>
  一边走一边看他不知道在什么时候写好的自传
  <br/>
  但是印刷质量不太好，歪歪扭扭的
  <br/>
  <br/>
  在河边走的时候进入了一个公园，然后在公园里边走边看
  <br/>
  看到了他的反抗与唾弃
  <br/>
  以及自上而下传承下来的，对自信力一脉相承的恐惧
  <br/>
  <br/>
  沿着路走出公园之后，回头发现自己重新回到了大路上
  <br/>
  距离刚开始读那本书，也只过去了一座桥的距离
  <br/>
  <br/>
  在阅读的时候我好像弄丢了一些东西，手套和耳机啥的
  <br/>
  还有一杯奶茶，好像是蜜雪吧
  <br/>
  喝完了就直接扔公园里的垃圾桶了
  <br/>
  <br/>
  自始至终他都没有出现，但是他到底是怎样的人
  <br/>
  手里的书已经告诉我答案了

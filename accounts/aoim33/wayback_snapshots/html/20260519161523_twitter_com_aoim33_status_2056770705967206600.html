  只要你不关注周围任何人的动态，不去揣测任何人的想法，不去问别人谁说你的坏话，不去设想一些还没发生的事情和不好的结果，你有没有发现，其实你真的很幸福。
  <br/>
  <br/>
  所以你的焦虑从哪儿来的？都是外界影响你的。不受外界影响的一大方法就是让你的手机为你服务，少看别人的动态，别人过得好不好关你什么事？要用手机查个单词咱们就查个单词，要查红烧肉怎么做就查红烧肉，不需要的时候就少看手机。
  <br/>

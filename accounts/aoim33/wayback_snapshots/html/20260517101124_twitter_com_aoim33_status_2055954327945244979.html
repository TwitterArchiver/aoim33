  忽然意识到苦难真的能带了文笔的优美，并不是歌颂苦难
  <br/>
  我无法写出一年前那样的文，我的精神状态比一年前好得多了，不再是过去那个需要子虚乌有的东西来维持精神稳定的我了，当我的痛苦不在能化为文学的养分的时候，我的灵感在不断的衰竭
  <br/>
  <br/>
  我在看一些小朋友，好像在看过去的自己，可我又比他们幸运，因为我找到了可以跳出那种不甘心态的契机
  <br/>
  他们又比我写得好的多，华丽的文笔，不同的修辞，果然是还在认真学习的小朋友们写下来的，没有被侵染，没有过多的自我意识与欣赏，这才是文学的土壤
  <br/>
  <br/>
  不过，希望养分不是他们的精神

  有一日小孩和螃蟹猜拳。
  <br/>
  小孩出了拳，螃蟹出了钳。
  <br/>
  “哈哈哈，你有钳又有什么用？没有拳，还不是我赢。”小孩大笑着说。
  <br/>
  一条鱼从水面冒头，他的身上挂着一张网。
  <br/>
  “我出布，我一定赢你！”
  <br/>
  “你为什么出布呢？”小孩看着鱼，也看着缠他身上的网。
  <br/>
  “因为我没有拳，也没有钳。”
  <br/>
  “哈哈哈！没钳没拳，那你怎么敢说布呢？”

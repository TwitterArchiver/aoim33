  目前我感觉
  <br/>
  人生就是一个人活着，不要对别人心存太多期待。我们总是想要找到，能为自己分担痛苦和悲伤的人，大多数时候，我们那些惊天动地的伤痛，在别人眼里，不过是随手拂过的尘埃
  <br/>

  <br/>

  相遇的意义是，被你改变的那部分我，代替你永远和我站在一起
  <br/>
  <br/>
  我是从什么时候意识到，我身上有无数个人的影子，有他们的习惯，有他们的口癖。我和很多人相遇又错过，我们曾经互相倾诉心事，但是最后又分
  <br/>
  那些和我相遇又错过的人，像火柴点燃蜡烛一样，把我融化又塑造成一个新的我，他们带走我的一部分，又留下他们的一部分。人应该是一整张拼图，每遇到一个人，就互换一块拼图。到最后，每个人都还是一张完整的拼图，但是每一块的图案都不同。那些不同图案的拼图，就留着怀念曾经那些互相挂念过的人吧
  <br/>
  <br/>
  因为人总是要分别

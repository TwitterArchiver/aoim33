  有网友总结过:
  <br/>
  <br/>
  在古代，“幸”字可以引申为别的含义，比如有君王临幸妃子，可以说:“帝幸之”，例如《史记・外戚世家》中:“是日，武帝起更衣，子夫侍尚衣轩中，得幸。”
  <br/>
  或者著名的春宫图《熙陵幸小周后图》，“幸”字就代表着发生性关系
  <br/>
  <br/>
  在现代，有了用“福”替代“逼”
  <br/>
  <br/>
  那么，我们就可以给以下词语赋予新的含义:
  <br/>
  “幸福”

<style type="text/css">
body {

  }

  .tweet-container {

  }

  .tweet-container > #nonjsonview {

  }

  .tweet-author {
    display: flex;
    flex-direction: row;
    align-items: center;
    padding-bottom: 0.75rem;
  }

  .tweet-author-profile-image img {

    height: 48px;
    max-height: 48px;
    overflow: hidden;
    border-radius: 50%;

  }

  .tweet-author-info {
    display: flex;
    flex-direction: column;
  }

  .tweet-author-name {
    font-weight: bold;
  }

  .tweet-content {
    font-size: 1.25rem;
  }

			.tweet-image {
				width: 100%;
				height: auto;
				margin-top: 12px;

			}

			.embedded-tweet-container {

				border: 1px solid #cfd9de;
    border-radius: 12px;
				background-color: white;
				max-width: 100%;
			}
			.date {
				font-size: 0.75rem;
				color: #657786;
				margin-top: 12px;
			}
			.date a {
				color: #657786;
				text-decoration: none;
			}
			.date a:hover {
				text-decoration: underline;
			}
  .on {
    display: block;
  }
  .off {
    display: none;
  }
</style>
</head>
